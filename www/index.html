<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Saku — Atur Keuangan</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2b3a20">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saku">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#eef1e4; --bg-2:#fbfaf4;
    --leather:#2b3a20; --leather-2:#1e2a16; --leather-light:#3c4f2b;
    --stitch: rgba(245,243,234,.35);
    --lime:#a8e05a; --cream:#f6f3e8; --ink:#1c2415;
    --muted:#7c8570; --muted-2:#9aa38c;
    --card-shadow: 0 30px 60px -20px rgba(23,32,15,.45);
    --gold:#c9a24d; --red:#b3492f; --green:#5c8a2e; --orange:#c98b34;
    --pop:#ffb545; --pop2:#ff6f61;
    --bounce: cubic-bezier(.34,1.56,.64,1);
    --font-display:'Baloo 2', sans-serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%; max-width:100%; overflow-x:hidden;}
  body{
    font-family:'Space Grotesk', sans-serif; font-weight:600;
    background: radial-gradient(1200px 600px at 15% -10%, #f4f6ea 0%, transparent 60%), linear-gradient(160deg, var(--bg-1), var(--bg-2) 60%);
    color:var(--ink); min-height:100vh; display:flex; -webkit-font-smoothing:antialiased; max-width:100vw;
  }
  ::selection{ background: var(--lime); color:var(--leather-2); }
  button{ font-family:inherit; }
  svg{ display:block; }

  .sidebar{ width:84px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; padding:28px 0; gap:8px; }
  .brand{ width:46px;height:46px;border-radius:15px; background:var(--leather); display:flex;align-items:center;justify-content:center; margin-bottom:28px; box-shadow: 0 8px 20px -8px rgba(43,58,32,.6); color:var(--lime); transition:.25s var(--bounce); }
  .brand:hover{ transform:scale(1.1) rotate(-6deg); }
  .brand svg{ width:22px; height:22px; }
  .navlist{ display:flex; flex-direction:column; gap:6px; flex:1; }
  .navitem{ width:48px;height:48px;border-radius:14px; border:none; background:none; display:flex;align-items:center;justify-content:center; color:var(--muted); cursor:pointer; transition:.25s var(--bounce); position:relative; }
  .navitem svg{ width:20px; height:20px; }
  .navitem:hover{ background:rgba(43,58,32,.08); color:var(--leather); transform:scale(1.08); }
  .navitem.active{ background:var(--leather); color:var(--lime); }
  .navitem.active::before{ content:''; position:absolute; left:-16px; width:4px; height:18px; border-radius:4px; background:var(--pop); }

  .main{ flex:1; min-width:0; padding:36px 44px 90px; max-width:1240px; width:100%; }
  header.top{ margin-bottom:26px; }
  .eyebrow{ font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:700; margin-bottom:6px; }
  h1.page-title{ font-family:var(--font-display); font-weight:800; font-size:34px; letter-spacing:-.01em; color:var(--leather); }
  h1.page-title span.hl{ background:linear-gradient(120deg, var(--pop) 0%, var(--pop) 100%); background-repeat:no-repeat; background-size:100% 40%; background-position:0 88%; padding:0 2px; }

  .grid{ display:grid; grid-template-columns: minmax(0,400px) minmax(0,1fr); gap:28px; align-items:start; min-width:0; }
  .grid > *{ min-width:0; }

  .wallet-zone{ display:flex; flex-direction:column; align-items:center; gap:18px; }
  .wallet-frame{ position:relative; width:100%; padding-top:64px; }
  .wallet-body{ position:relative; z-index:1; background: linear-gradient(160deg, var(--leather-light), var(--leather) 55%, var(--leather-2)); border-radius:34px; padding:118px 26px 26px; box-shadow: var(--card-shadow); overflow:visible; isolation:isolate; }
  .wallet-body::after{ content:''; position:absolute; inset:10px; border-radius:26px; border:1.5px dashed var(--stitch); pointer-events:none; }
  .wallet-body::before{ content:''; position:absolute; inset:0; border-radius:34px; background: radial-gradient(120% 60% at 30% 0%, rgba(255,255,255,.08), transparent 60%); pointer-events:none; }
  .pocket-seam{ position:absolute; left:26px; right:26px; top:118px; height:34px; border-top:1.5px dashed var(--stitch); border-radius:0 0 20px 20px; pointer-events:none; }

  .cardstack{ position:absolute; top:12px; left:26px; right:26px; height:150px; perspective:600px; z-index:5; }
  .paycard{ position:absolute; left:0; right:0; height:104px; border-radius:18px 18px 8px 8px; cursor:grab; touch-action:none; transition: transform .5s var(--bounce), box-shadow .3s, top .5s var(--bounce); box-shadow: 0 14px 24px -12px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.25); display:flex; flex-direction:column; justify-content:space-between; padding:14px 18px; overflow:hidden; }
  .paycard:active{ cursor:grabbing; }
  .paycard::after{ content:''; position:absolute; top:-60%; left:-20%; width:70%; height:220%; background:linear-gradient(115deg, rgba(255,255,255,.22), transparent 55%); transform:rotate(8deg); pointer-events:none; }
  .paycard .top-line{ display:flex; justify-content:space-between; align-items:flex-start; position:relative; z-index:1; }
  .paycard .icon-badge{ width:26px; height:26px; border-radius:9px; background:rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center; filter:drop-shadow(0 1px 1px rgba(0,0,0,.15)); }
  .paycard .icon-badge svg{ width:15px; height:15px; }
  .paycard .brandmark{ font-family:var(--font-display); font-weight:700; font-size:16px; position:relative; z-index:1; }
  .paycard .digits{ font-family:'Fraunces', serif; font-weight:700; font-size:13px; letter-spacing:.02em; opacity:.95; position:relative; z-index:1; }
  .paycard:hover{ box-shadow: 0 20px 32px -14px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.25); }
  .paycard.raised{ top:-46px !important; transform: scale(1.06) !important; z-index:40 !important; box-shadow: 0 24px 40px -14px rgba(0,0,0,.5), 0 0 0 3px var(--pop); }
  .paycard.locked-card{ filter:grayscale(.5) brightness(.88); }
  .locked-tag{ position:relative; z-index:1; font-size:9.5px; letter-spacing:.06em; text-transform:uppercase; background:rgba(0,0,0,.35); padding:3px 7px; border-radius:20px; font-weight:700; display:flex; align-items:center; gap:3px; }
  .locked-tag svg{ width:9px; height:9px; }
  .add-card-slot{ position:absolute; left:0; right:0; height:104px; border-radius:18px; border:2px dashed var(--stitch); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:4px; color:var(--muted-2); cursor:pointer; transition:.25s var(--bounce); background:rgba(255,255,255,.02); }
  .add-card-slot:hover{ border-color:var(--pop); color:var(--pop); transform:scale(1.02); }
  .add-card-slot svg{ width:18px; height:18px; }
  .add-card-slot span{ font-size:11px; font-weight:700; }

  .pocket-lower{ position:relative; z-index:0; padding-top:16px; display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; }
  .balance-mask{ font-family:'Fraunces', serif; font-weight:700; font-size:26px; letter-spacing:.01em; color:var(--cream); min-height:32px; display:flex; align-items:center; justify-content:center; }
  .balance-label{ font-size:12px; letter-spacing:.1em; color:var(--muted-2); text-transform:uppercase; font-weight:700; }
  .eye-toggle{ margin-top:14px; width:38px;height:38px; border-radius:50%; border:1px solid rgba(245,243,234,.25); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--cream); transition:.25s var(--bounce); background:rgba(0,0,0,.1); }
  .eye-toggle:hover{ background:rgba(245,243,234,.12); transform:scale(1.1); }
  .eye-toggle:active{ transform:scale(.9); }
  .eye-toggle svg{ width:16px; height:16px; }

  .wallet-hint{ font-size:12px; color:var(--muted); text-align:center; max-width:280px; line-height:1.5; font-weight:600; }
  .wallet-hint b{ color:var(--leather); font-weight:800; }

  .detail-panel{ background:var(--bg-2); border:1px solid rgba(43,58,32,.1); border-radius:26px; padding:26px; min-height:480px; display:flex; flex-direction:column; gap:18px; }
  .detail-empty{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); text-align:center; }
  .detail-empty svg{ width:34px; height:34px; opacity:.5; }
  .detail-empty p{ font-size:13.5px; max-width:220px; line-height:1.5; font-weight:600; }

  .pocket-head{ border-radius:22px; padding:20px; position:relative; overflow:hidden; box-shadow: 0 20px 40px -18px rgba(0,0,0,.4); }
  .pocket-head::after{ content:''; position:absolute; top:-60%; left:-10%; width:60%; height:220%; background:linear-gradient(115deg, rgba(255,255,255,.16), transparent 55%); transform:rotate(8deg); pointer-events:none; }
  .pocket-head .top-row{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:18px; position:relative; z-index:1; }
  .pocket-head .brandmark{ font-family:var(--font-display); font-size:21px; font-weight:800; display:flex; align-items:center; gap:9px; }
  .pocket-head .icon-badge{ width:34px; height:34px; border-radius:11px; background:rgba(255,255,255,.28); display:flex; align-items:center; justify-content:center; }
  .pocket-head .icon-badge svg{ width:19px; height:19px; }
  .pocket-head .lockbadge{ font-size:10px; text-transform:uppercase; letter-spacing:.06em; background:rgba(0,0,0,.3); padding:3px 8px; border-radius:20px; display:flex; align-items:center; gap:4px; font-weight:700; }
  .pocket-head .lockbadge svg{ width:10px; height:10px; }
  .pocket-head .bal-label{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; margin-bottom:4px; position:relative; z-index:1; font-weight:700; }
  .pocket-head .bal-value{ font-family:'Fraunces', serif; font-size:25px; font-weight:700; position:relative; z-index:1; }

  .goal-bar-wrap{ margin-top:16px; position:relative; z-index:1; }
  .goal-bar-labels{ display:flex; justify-content:space-between; font-size:10.5px; opacity:.85; margin-bottom:6px; font-weight:700; }
  .goal-bar{ height:8px; border-radius:8px; background:rgba(255,255,255,.25); overflow:hidden; }
  .goal-bar-fill{ height:100%; border-radius:8px; background:var(--pop); transition:width .5s var(--bounce); }
  .goal-hit{ margin-top:8px; font-size:11.5px; font-weight:700; position:relative; z-index:1; animation:pulseGlow 1.6s ease-in-out infinite; }
  @keyframes pulseGlow{ 0%,100%{ opacity:1; } 50%{ opacity:.6; } }

  .detail-meta{ display:flex; flex-direction:column; gap:10px; }
  .meta-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; border-radius:16px; background:var(--bg-1); }
  .meta-row .k{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
  .meta-row .v{ font-family:'Fraunces', serif; font-size:13.5px; font-weight:700; }
  .meta-row .v.down{ color:var(--red); }

  .card-actions{ display:flex; gap:10px; flex-wrap:wrap; }
  .btn{ position:relative; overflow:hidden; flex:1; padding:12px 14px; border-radius:16px; border:none; cursor:pointer; font-weight:700; font-size:13px; display:flex; align-items:center; justify-content:center; gap:6px; transition:.2s var(--bounce); }
  .btn.primary{ background:var(--leather); color:var(--lime); }
  .btn.primary:hover{ background:var(--leather-2); transform:translateY(-1px); }
  .btn.ghost{ background:var(--bg-1); color:var(--leather); }
  .btn.ghost:hover{ background:#e4e7d7; }
  .btn.danger{ background:#fbe9e5; color:var(--red); }
  .btn.danger:hover{ background:#f6d8d1; }
  .btn.small{ flex:none; padding:9px 12px; font-size:12px; }
  .btn[disabled]{ opacity:.5; cursor:not-allowed; }
  .btn:active{ transform:scale(.95); }

  .mini-tx-title{ font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin-bottom:2px; font-weight:700; }

  .right-col{ display:flex; flex-direction:column; gap:20px; }
  .stat-row{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat-card{ background:var(--bg-2); border:1px solid rgba(43,58,32,.1); border-radius:18px; padding:16px 16px 14px; }
  .stat-card .k{ font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; margin-bottom:8px; font-weight:700; display:flex; align-items:center; gap:5px; }
  .stat-card .k svg{ width:12px;height:12px; }
  .stat-card .v{ font-family:'Fraunces', serif; font-size:19px; font-weight:700; }
  .stat-card .v.up{ color:var(--green); }
  .stat-card .v.down{ color:var(--red); }
  .stat-card.clickable{ cursor:pointer; transition:.2s var(--bounce); }
  .stat-card.clickable:hover{ transform:translateY(-3px) scale(1.02); border-color:var(--pop); }
  .stat-card.clickable:active{ transform:translateY(0) scale(.97); }

  .panel{ background:var(--bg-2); border:1px solid rgba(43,58,32,.1); border-radius:22px; padding:22px; }
  .panel-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:10px; flex-wrap:wrap; }
  .panel-head h3{ font-family:var(--font-display); font-weight:700; font-size:18px; display:flex; align-items:center; gap:8px; }
  .panel-head h3 svg{ width:18px;height:18px; }
  .panel-head-actions{ display:flex; gap:8px; align-items:center; }
  .panel-head button.linklike{ border:none; background:none; font-size:12.5px; color:var(--muted); cursor:pointer; font-weight:700; }
  .panel-head button.linklike:hover{ color:var(--leather); }
  .icon-link-btn{ width:30px;height:30px; border-radius:10px; border:none; background:var(--bg-1); color:var(--leather); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s var(--bounce); }
  .icon-link-btn:hover{ background:var(--pop); color:var(--leather-2); }
  .icon-link-btn svg{ width:14px;height:14px; }

  .budget-empty{ font-size:13px; color:var(--muted); text-align:center; padding:10px 0 4px; line-height:1.5; font-weight:600; }
  .budget-rows{ display:flex; flex-direction:column; gap:8px; margin-bottom:14px; }
  .budget-row{ display:flex; justify-content:space-between; font-size:13px; }
  .budget-row .bk{ color:var(--muted); font-weight:600; }
  .budget-row .bv{ font-family:'Fraunces', serif; font-weight:700; }
  .budget-outer-bar{ height:11px; border-radius:9px; background:var(--bg-1); overflow:hidden; }
  .budget-outer-fill{ height:100%; border-radius:9px; background:var(--green); transition:width .5s var(--bounce); }
  .budget-outer-fill.warn{ background:var(--orange); }
  .budget-outer-fill.over{ background:var(--red); }
  .budget-status{ font-size:12px; font-weight:700; margin-top:9px; color:var(--green); }
  .budget-status.over{ color:var(--red); }

  .donut-wrap{ display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  .donut{ position:relative; width:104px; height:104px; border-radius:50%; flex-shrink:0; transition:.3s; }
  .donut-hole{ position:absolute; inset:17px; background:var(--bg-2); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .donut-hole .dh-amt{ font-family:'Fraunces', serif; font-size:11px; font-weight:700; line-height:1.2; }
  .donut-hole .dh-label{ font-size:8.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; margin-top:2px; font-weight:700; }
  .legend{ flex:1; min-width:150px; display:flex; flex-direction:column; gap:4px; }
  .legend-item{ display:flex; align-items:center; gap:8px; font-size:12px; cursor:pointer; padding:5px 8px; border-radius:12px; transition:.2s var(--bounce); font-weight:600; }
  .legend-item:hover{ background:var(--bg-1); }
  .legend-item.active{ background:var(--leather); color:var(--lime); font-weight:700; }
  .legend-icon{ width:20px; height:20px; border-radius:7px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ink); }
  .legend-icon svg{ width:11px;height:11px; }
  .legend-name{ flex:1; }
  .legend-pct{ color:var(--muted); font-size:11px; }
  .legend-item.active .legend-pct{ color:var(--lime); opacity:.8; }

  .trend-chart{ display:flex; align-items:flex-end; gap:10px; height:110px; padding:6px 2px; }
  .trend-col{ flex:1; display:flex; flex-direction:column; align-items:center; gap:6px; height:100%; justify-content:flex-end; }
  .trend-bars{ display:flex; gap:3px; align-items:flex-end; height:90px; width:100%; justify-content:center; }
  .trend-bar{ width:10px; border-radius:6px 6px 2px 2px; min-height:3px; transition:height .5s var(--bounce); }
  .trend-bar.income{ background:var(--green); }
  .trend-bar.expense{ background:var(--red); }
  .trend-label{ font-size:10px; color:var(--muted); text-transform:capitalize; font-weight:700; }
  .trend-legend{ display:flex; gap:14px; justify-content:center; margin-top:8px; font-size:11px; color:var(--muted); font-weight:600; }
  .trend-legend .dot{ display:inline-block; width:8px;height:8px;border-radius:50%; margin-right:4px; }
  .trend-legend .dot.income{ background:var(--green); }
  .trend-legend .dot.expense{ background:var(--red); }

  .tx-filters{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .chip{ padding:6px 13px; border-radius:20px; border:2px solid rgba(43,58,32,.15); font-size:12px; font-weight:700; color:var(--muted); cursor:pointer; transition:.2s var(--bounce); background:none; }
  .chip:active{ transform:scale(.93); }
  .chip.active{ border-color:var(--leather); background:var(--leather); color:var(--lime); }
  .tx-search{ margin-bottom:10px; }
  .tx-search input{ width:100%; padding:9px 13px; border-radius:13px; border:1px solid rgba(43,58,32,.15); background:var(--bg-1); font-family:inherit; font-size:12.5px; color:var(--ink); font-weight:600; }
  .tx-search input:focus{ outline:2px solid var(--pop); outline-offset:1px; }
  .active-filter-badge{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; background:var(--bg-1); padding:5px 10px; border-radius:20px; margin-bottom:12px; color:var(--leather); font-weight:700; }
  .active-filter-badge button{ border:none;background:none;cursor:pointer;color:var(--muted); display:flex; padding:0; }
  .active-filter-badge button:hover{ color:var(--red); }

  .tx-row{ display:flex; align-items:center; justify-content:space-between; padding:12px 4px; border-bottom:1px solid rgba(43,58,32,.08); gap:10px; }
  .tx-row:last-child{ border-bottom:none; padding-bottom:0; }
  .tx-left{ display:flex; align-items:center; gap:12px; min-width:0; }
  .tx-icon{ width:38px;height:38px;border-radius:13px; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--ink); }
  .tx-icon svg{ width:17px; height:17px; }
  .tx-text{ min-width:0; }
  .cat-pill{ display:inline-flex; align-items:center; gap:4px; font-size:10.5px; font-weight:700; padding:2px 9px 2px 6px; border-radius:20px; color:var(--ink); }
  .cat-pill svg{ width:11px;height:11px; }
  .tx-sub{ font-size:11.5px; color:var(--muted); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
  .tx-right{ display:flex; align-items:center; gap:8px; flex-shrink:0; }
  .tx-amt{ font-family:'Fraunces', serif; font-size:13.5px; font-weight:700; white-space:nowrap; }
  .tx-amt.neg{ color:var(--ink); }
  .tx-amt.pos{ color:var(--green); }
  .tx-empty{ text-align:center; color:var(--muted); font-size:13px; padding:20px 0; font-weight:600; }
  .tx-actions{ display:flex; gap:4px; }
  .tx-icon-btn{ width:26px;height:26px; border-radius:9px; border:none; background:var(--bg-1); color:var(--muted); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:.2s var(--bounce); }
  .tx-icon-btn:hover{ background:#e4e7d7; color:var(--leather); }
  .tx-icon-btn svg{ width:12px;height:12px; }
  .mini-tx-row .tx-row{ padding:10px 0; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(20,24,16,.5); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; backdrop-filter: blur(3px); }
  .modal-overlay.open{ display:flex; }
  .modal-box{ background:var(--bg-2); border-radius:26px; width:100%; max-width:400px; padding:26px; max-height:88vh; overflow-y:auto; animation: popIn .3s var(--bounce); }
  .modal-box.shake{ animation: shakeX .4s; }
  @keyframes popIn{ 0%{ transform:scale(.9); opacity:0; } 100%{ transform:scale(1); opacity:1; } }
  @keyframes shakeX{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(7px); } 60%{ transform:translateX(-5px); } 80%{ transform:translateX(4px); } }

<script>
  const ICON_PATHS = {
    wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18"/><circle cx="16.5" cy="14.5" r="1.1" fill="currentColor" stroke="none"/>',
    bank:'<path d="M4 10l8-5 8 5"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8"/><path d="M3 21h18"/>',
    target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4.3"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/>',
    bowl:'<path d="M4 11h16a8 8 0 01-16 0z"/><path d="M9 11c0-2 1-3 1-5M13 11c0-2 1-3 1-5"/>',
    game:'<rect x="3" y="8" width="18" height="9" rx="4"/><path d="M8 10.5v3M6.5 12h3"/><circle cx="16" cy="11.3" r="1" fill="currentColor" stroke="none"/><circle cx="18" cy="13.3" r="1" fill="currentColor" stroke="none"/>',
    car:'<path d="M4 16V12l2-5h12l2 5v4"/><path d="M4 16h16"/><circle cx="7.5" cy="16.5" r="1.5"/><circle cx="16.5" cy="16.5" r="1.5"/>',
    house:'<path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/><path d="M10 19v-5h4v5"/>',
    plane:'<path d="M3 12l18-8-8 18-2-8-8-2z"/>',
    food:'<path d="M7 2v8a2 2 0 004 0V2M9 10v12M17 2c-1.5 0-3 1.5-3 4s1.5 5 3 5 3-2 3-5-1.5-4-3-4zM17 11v11"/>',
    bus:'<rect x="3" y="6" width="18" height="10" rx="3"/><path d="M3 12h18M7 6v6M17 6v6"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/>',
    receipt:'<path d="M6 2h12v18l-2-1.5L14 20l-2-1.5L10 20l-2-1.5L6 20V2z"/><path d="M9 7h6M9 11h6M9 15h4"/>',
    bag:'<path d="M6 8h12l-1 12H7L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/>',
    party:'<circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5-6-3.5z" fill="currentColor" stroke="none"/>',
    heart:'<path d="M12 20s-7-4.5-9.5-9A5.5 5.5 0 0112 5a5.5 5.5 0 019.5 6c-2.5 4.5-9.5 9-9.5 9z"/><path d="M6 12h3l1.5-3L12 15l1.5-3H18"/>',
    sparkle:'<path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z"/>',
  };
  function iconSvg(key){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + (ICON_PATHS[key] || ICON_PATHS.sparkle) + '</svg>';
  }

  const COLORS = {
    purple: { bg:'linear-gradient(120deg,#5a5fe0,#8b7ff0)', text:'#fff' },
    blue:   { bg:'linear-gradient(120deg,#0b3d91,#1554c4)', text:'#fff' },
    cream:  { bg:'linear-gradient(120deg,#fbfbfa,#eceae0)', text:'#1c2415' },
    forest: { bg:'linear-gradient(120deg,#3c4f2b,#5c7a3e)', text:'#fff' },
    sunset: { bg:'linear-gradient(120deg,#d1495b,#e0785a)', text:'#fff' },
  };
  const CATEGORIES = ['Makanan','Transportasi','Tagihan','Belanja','Hiburan','Kesehatan','Lainnya'];
  const CATEGORY_COLOR = { Makanan:'#f2c185', Transportasi:'#9fc4e8', Tagihan:'#f0a8a0', Belanja:'#c7a8ec', Hiburan:'#9fe0d0', Kesehatan:'#f2a8c4', Lainnya:'#cfd6c2' };
  const CATEGORY_ICON = { Makanan:'food', Transportasi:'bus', Tagihan:'receipt', Belanja:'bag', Hiburan:'party', Kesehatan:'heart', Lainnya:'sparkle' };
  const POCKET_ICON_KEYS = ['wallet','bank','target','bowl','game','car','house','plane'];
  const STORAGE_KEY = 'saku-wallet-state-v6';
  const MAX_POCKETS = 3;
  const TODAY = '2026-07-26';
  const SUCCESS_PHRASES = ['Mantap!','Sip, tercatat!','Gaskeun!','Nice satu lagi!'];

  let state = null;
  let activePocket = null;
  let newlyAddedId = null;
  const celebratedGoals = new Set();
  let txExpanded = false;
  let filterState = { type:'all', category:null, search:'' };
  let lastShownBalance = null;

  function animateNumber(el, from, to, formatFn, duration){
    if(from === to){ el.textContent = formatFn(to); return; }
    const start = performance.now();
    function step(now){
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = from + (to - from) * eased;
      el.textContent = formatFn(val);
      if(p < 1) requestAnimationFrame(step);
      else el.textContent = formatFn(to);
    }
    requestAnimationFrame(step);
  }
  function flashPanel(id){
    const el = document.getElementById(id);
    if(!el) return;
    el.classList.remove('flash-highlight');
    void el.offsetWidth;
    el.classList.add('flash-highlight');
  }
  function shakeModal(){
    const box = document.getElementById('modalBox');
    box.classList.remove('shake');
    void box.offsetWidth;
    box.classList.add('shake');
  }
  function randomSuccess(){ return SUCCESS_PHRASES[Math.floor(Math.random()*SUCCESS_PHRASES.length)]; }

  function defaultState(){
    return {
      balanceHidden: true,
      monthlyBudget: null,
      pockets: []
    };
  }

  function normalizeState(s){
    if(typeof s.monthlyBudget === 'undefined') s.monthlyBudget = null;
    s.pockets.forEach(function(p){
      if(!p.icon) p.icon = 'wallet';
      if(typeof p.goal === 'undefined') p.goal = null;
      if(typeof p.locked === 'undefined') p.locked = false;
      p.transactions.forEach(function(t){
        if(!t.category) t.category = 'Lainnya';
        if(typeof t.note === 'undefined') t.note = t.name || '';
      });
    });
    return s;
  }

  async function loadState(){
    try{
      const raw = window.localStorage.getItem(STORAGE_KEY);
      state = raw ? normalizeState(JSON.parse(raw)) : defaultState();
    }catch(e){
      state = defaultState();
      await saveState();
    }
    renderAll();
    const skel = document.getElementById('skeletonWrap');
    if(skel){ skel.classList.add('hidden'); setTimeout(function(){ skel.remove(); }, 400); }
  }
  async function saveState(){
    try{ window.localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){ /* silent */ }
  }

  function showToastMsg(msg){
    const t = document.getElementById('toast');

  function fireConfetti(){
    const colors = [getComputedStyle(document.documentElement).getPropertyValue('--pop'), 'var(--lime)', 'var(--leather)', 'var(--pop2)'];
    for(let i=0; i<18; i++){
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      const shape = Math.random() > 0.5 ? '50%' : '3px';
      el.style.width = (6 + Math.random()*5) + 'px';
      el.style.height = el.style.width;
      el.style.borderRadius = shape;
      el.style.background = colors[Math.floor(Math.random()*colors.length)];
      const startX = window.innerWidth/2 + (Math.random()-0.5)*120;
      const dx = (Math.random()-0.5)*300;
      const dy = 200 + Math.random()*200;
      const rot = (Math.random()-0.5)*360;
      el.style.left = startX + 'px';
      el.style.top = (window.innerHeight*0.35) + 'px';
      el.style.setProperty('--dx', dx + 'px');
      el.style.setProperty('--dy', dy + 'px');
      el.style.setProperty('--rot', rot + 'deg');

  function showUndoToast(msg, undoFn){

    window._toastUndo = function(){ undoFn(); t.classList.remove('show'); };

  function rupiah(n){
    const sign = n < 0 ? '-' : '';
    return sign + 'Rp' + Math.abs(Math.round(n)).toLocaleString('id-ID');

  function scrollToSection(id){
    document.querySelectorAll('.navitem').forEach(function(n){ n.classList.remove('active'); });
    const map = { top:'navHome', wallet:'navCards', txpanel:'navTx' };

  function pocketBalance(p){ return p.transactions.reduce(function(sum,t){ return sum + t.amount; }, 0); }
  function totalBalance(){ return state.pockets.reduce(function(sum,p){ return sum + pocketBalance(p); }, 0); }
  function isThisMonth(dateStr){
    const d = new Date(dateStr), now = new Date(TODAY);
    return d.getMonth()===now.getMonth() && d.getFullYear()===now.getFullYear();
  }
  function pocketSpentThisMonth(p){
    return p.transactions.filter(function(t){ return t.amount<0 && isThisMonth(t.date); }).reduce(function(s,t){ return s + Math.abs(t.amount); }, 0);
  }
  function topCategoryForPocket(p){
    const totals = {};
    p.transactions.forEach(function(t){
      if(t.amount < 0 && isThisMonth(t.date)){ totals[t.category] = (totals[t.category]||0) + Math.abs(t.amount); }
    });
    const keys = Object.keys(totals);
    if(keys.length === 0) return null;
    keys.sort(function(a,b){ return totals[b]-totals[a]; });
    return { category:keys[0], amount:totals[keys[0]] };
  }
  function allTransactionsFlat(){
    const flat = [];
    state.pockets.forEach(function(p){
      p.transactions.forEach(function(t){ flat.push(Object.assign({}, t, { pocketName:p.name, pocketId:p.id })); });
    });
    return flat.sort(function(a,b){ return new Date(b.date) - new Date(a.date) || b.id - a.id; });
  }
  function monthlyIncomeExpense(){
    let income = 0, expense = 0;
    allTransactionsFlat().forEach(function(t){
      if(isThisMonth(t.date)){ if(t.amount > 0) income += t.amount; else expense += Math.abs(t.amount); }
    });
    return { income:income, expense:expense };
  }
  function findTxRef(id){
    for(let pi=0; pi<state.pockets.length; pi++){
      const p = state.pockets[pi];
      const idx = p.transactions.findIndex(function(t){ return t.id===id; });
      if(idx !== -1) return { pocket:p, idx:idx, tx:p.transactions[idx] };
    }
    return null;
  }
  function wouldBalanceCoverExpense(pocket, excludeTxId, expenseAmt){
    const bal = pocket.transactions.filter(function(t){ return t.id!==excludeTxId; }).reduce(function(s,t){ return s + t.amount; }, 0);
    return expenseAmt <= bal;
  }

  function renderCardstack(){
    const stack = document.getElementById('cardstack');
    const n = state.pockets.length;
    let html = '';
    state.pockets.forEach(function(p, idx){
      const backIndex = (n - 1 - idx);
      const top = backIndex * 34;
      const scale = 1 - backIndex * 0.02;
      const z = idx + 2;
      const col = COLORS[p.colorKey] || COLORS.forest;
      const isRaised = activePocket === p.id;
      const isNew = newlyAddedId === p.id;
      const bal = state.balanceHidden ? '••••••' : rupiah(pocketBalance(p));
      html += '<div class="paycard ' + (isRaised?'raised':'') + ' ' + (p.locked?'locked-card':'') + ' ' + (isNew?'card-enter':'') + '" data-card="' + p.id + '" data-scale="' + scale + '" data-top="' + top + '"' +
        ' style="top:' + top + 'px; z-index:' + z + '; transform:scale(' + scale + '); background:' + col.bg + '; color:' + col.text + ';"' +
        ' onclick="selectPocket(' + p.id + ')">' +
        '<div class="top-line"><span class="icon-badge">' + iconSvg(p.icon) + '</span>' +
        (p.locked ? '<div class="locked-tag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg>Kunci</div>' :
          '<button class="quick-del" title="Hapus kartu" onclick="event.stopPropagation(); quickDeletePocket(' + p.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>') +
        '</div>' +
        '<div><div class="brandmark">' + escapeHtml(p.name) + '</div><div class="digits">' + bal + '</div></div>' +
        '</div>';
    });
    stack.innerHTML = html;
    newlyAddedId = null;
    stack.querySelectorAll('.paycard').forEach(function(card){
      const baseScale = card.dataset.scale || 1;
      card.addEventListener('mousemove', function(e){
        if(card.classList.contains('raised')) return;
        const rect = card.getBoundingClientRect();
        const px = (e.clientX - rect.left) / rect.width - 0.5;
        const py = (e.clientY - rect.top) / rect.height - 0.5;
        card.style.transform = 'scale(' + baseScale + ') rotateX(' + (-py*8) + 'deg) rotateY(' + (px*8) + 'deg)';
      });
      card.addEventListener('mouseleave', function(){
        if(card.classList.contains('raised')) return;
        card.style.transform = 'scale(' + baseScale + ')';
      });

      const cardId = parseInt(card.dataset.card, 10);
      const restTop = parseFloat(card.dataset.top || '0');
      let dragging = false, startY = 0, moved = false;
      card.addEventListener('pointerdown', function(e){
        if(card.classList.contains('raised')) return;
        if(e.target.closest('.quick-del')) return;
        dragging = true; moved = false; startY = e.clientY;
        card.style.transition = 'none';
        try{ card.setPointerCapture(e.pointerId); }catch(err){}
      });
      card.addEventListener('pointermove', function(e){
        if(!dragging) return;
        const deltaY = startY - e.clientY;
        if(Math.abs(deltaY) > 4) moved = true;
        let newTop = restTop - deltaY;
        const minTop = -80;
        if(newTop < minTop) newTop = minTop + (newTop - minTop) * 0.2;
        if(newTop > restTop + 16) newTop = restTop + 16;
        card.style.top = newTop + 'px';
      });
      function endDrag(){
        if(!dragging) return;
        dragging = false;
        card.style.transition = '';
        if(moved){
          const finalTop = parseFloat(card.style.top);
          if(finalTop < restTop - 22){
            dragSuppressClick = true;
            activePocket = cardId;
            setTimeout(function(){ dragSuppressClick = false; }, 300);
            renderCardstack(); renderDetail();
          }else{
            card.style.top = restTop + 'px';
          }
        }
      }
      card.addEventListener('pointerup', endDrag);
      card.addEventListener('pointercancel', endDrag);
    });
  }

        '</div>' +

        goalHtml +
      '</div>' +
      '<div class="detail-meta">' +

      '</div>' +

        '<button class="btn ghost" onclick="openTxModal(\'expense\', ' + p.id + ')" ' + (p.locked?'disabled':'') + '>- Pengeluaran</button>' +
      '</div>' +
      '<div>' +
        '<div class="mini-tx-title">Riwayat kartu ini</div>' +

      '<div class="card-actions" id="deleteRow">' +
        '<button class="btn ghost small" onclick="toggleLock(' + p.id + ')">' + (p.locked ? 'Buka kunci' : 'Kunci kartu') + '</button>' +
        '<button class="btn danger small" onclick="askDeletePocket(' + p.id + ')">Hapus kartu</button>' +
      '</div>';
    if(p.goal){ animateBarFill('#goalFillBar', Math.min(100, Math.round((bal / p.goal) * 100))); }

  function quickDeletePocket(id){
    const idx = state.pockets.findIndex(function(p){ return p.id===id; });
    if(idx === -1) return;
    const removed = state.pockets[idx];
    const el = document.querySelector('.paycard[data-card="' + id + '"]');
    if(el){ el.style.transition = 'transform .3s var(--bounce), opacity .3s'; el.style.transform = 'scale(.7) rotate(8deg)'; el.style.opacity = '0'; }
    setTimeout(function(){
      state.pockets = state.pockets.filter(function(p){ return p.id!==id; });
      if(activePocket === id) activePocket = null;
      renderAll();
      saveState();
      showUndoToast('Kartu "' + escapeHtml(removed.name) + '" dihapus', function(){
        state.pockets.splice(idx, 0, removed);
        newlyAddedId = removed.id;
        renderAll();
        saveState();
        showToastMsg('Kartu dikembalikan');
      });
    }, 220);
  }

  function txRowHtml(t, pocketName, compact){
    const catColor = CATEGORY_COLOR[t.category] || CATEGORY_COLOR.Lainnya;
    const catIcon = CATEGORY_ICON[t.category] || 'sparkle';
    const sub = (t.note ? escapeHtml(t.note) + ' · ' : '') + (compact ? '' : escapeHtml(pocketName) + ' · ') + formatDate(t.date);
    return '<div class="tx-row">' +
      '<div class="tx-left">' +
        '<div class="tx-icon" style="background:' + catColor + ';">' + iconSvg(catIcon) + '</div>' +
        '<div class="tx-text">' +
          '<span class="cat-pill" style="background:' + catColor + '; cursor:pointer;" onclick="setFilterCategory(\'' + t.category + '\')" title="Filter kategori ini">' + iconSvg(catIcon) + escapeHtml(t.category) + '</span>' +
          '<div class="tx-sub">' + sub + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="tx-right">' +
        '<div class="tx-amt ' + (t.amount>0?'pos':'neg') + '">' + (t.amount>0?'+':'-') + rupiah(Math.abs(t.amount)) + '</div>' +
        '<div class="tx-actions">' +
          '<button class="tx-icon-btn" title="Edit" onclick="editTransaction(' + t.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>' +
          '<button class="tx-icon-btn" title="Hapus" onclick="deleteTransaction(' + t.id + ')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg></button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  function filteredTransactions(){
    let flat = allTransactionsFlat();
    if(filterState.type === 'income') flat = flat.filter(function(t){ return t.amount > 0; });
    if(filterState.type === 'expense') flat = flat.filter(function(t){ return t.amount < 0; });
    if(filterState.category) flat = flat.filter(function(t){ return t.category === filterState.category; });
    if(filterState.search){
      const q = filterState.search.toLowerCase();
      flat = flat.filter(function(t){
        return (t.note||'').toLowerCase().includes(q) || t.category.toLowerCase().includes(q) || t.pocketName.toLowerCase().includes(q);
      });
    }
    return flat;
  }
  function setFilterType(type){
    filterState.type = filterState.type === type ? 'all' : type;
    document.querySelectorAll('.chip[data-type]').forEach(function(c){ c.classList.toggle('active', c.dataset.type === filterState.type); });
    renderTxList();
  }
  function setFilterCategory(cat){
    filterState.category = filterState.category === cat ? null : cat;
    renderBreakdown(); renderTxList();
  }
  function clearCategoryFilter(){ filterState.category = null; renderBreakdown(); renderTxList(); }
  function setSearch(v){ filterState.search = v; renderTxList(); }
  function renderActiveCatBadge(){
    const el = document.getElementById('activeCatFilter');
    if(!filterState.category){ el.innerHTML = ''; return; }
    el.innerHTML = '<div class="active-filter-badge">Kategori: ' + escapeHtml(filterState.category) +
      '<button onclick="clearCategoryFilter()" title="Hapus filter"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>';
  }
  function renderTxList(){
    renderActiveCatBadge();
    const filtered = filteredTransactions();
    const shown = txExpanded ? filtered : filtered.slice(0,5);
    if(shown.length === 0){
      document.getElementById('txList').innerHTML = '<div class="tx-empty">Gak ada transaksi yang cocok.</div>';
    }else{
      document.getElementById('txList').innerHTML = shown.map(function(t){ return txRowHtml(t, t.pocketName, false); }).join('');
    }
    document.getElementById('txToggleBtn').textContent = txExpanded ? 'Sembunyikan' : 'Lihat semua';
  }
  function toggleTxView(){ txExpanded = !txExpanded; renderTxList(); }

  function editTransaction(id){
    const ref = findTxRef(id);
    if(!ref) return;
    const type = ref.tx.amount > 0 ? 'income' : 'expense';
    openTxModal(type, ref.pocket.id, id);
  }
  function deleteTransaction(id){
    const ref = findTxRef(id);
    if(!ref) return;
    ref.pocket.transactions.splice(ref.idx, 1);
    renderAll();
    saveState();
    showToastMsg('Transaksi dihapus');
  }

  function renderBreakdown(){
    const body = document.getElementById('breakdownBody');
    const totals = {};
    allTransactionsFlat().forEach(function(t){
      if(t.amount < 0 && isThisMonth(t.date)){ totals[t.category] = (totals[t.category]||0) + Math.abs(t.amount); }
    });
    const total = Object.values(totals).reduce(function(s,v){ return s+v; }, 0);
    if(total === 0){
      body.innerHTML = '<div class="budget-empty">Belum ada pengeluaran bulan ini.</div>';
      return;
    }
    let cumulative = 0;
    const stops = [];
    const legendItems = [];
    CATEGORIES.forEach(function(cat){
      const val = totals[cat] || 0;
      if(val <= 0) return;
      const pct = (val/total) * 100;
      const color = CATEGORY_COLOR[cat];
      stops.push(color + ' ' + cumulative + '% ' + (cumulative+pct) + '%');
      cumulative += pct;
      legendItems.push({ cat:cat, val:val, pct:pct, color:color });
    });
    const legendHtml = legendItems.map(function(it){
      const active = filterState.category === it.cat;
      return '<div class="legend-item ' + (active?'active':'') + '" onclick="setFilterCategory(\'' + it.cat + '\')">' +
        '<span class="legend-icon" style="background:' + it.color + ';">' + iconSvg(CATEGORY_ICON[it.cat]) + '</span>' +
        '<span class="legend-name">' + it.cat + '</span>' +
        '<span class="legend-pct">' + Math.round(it.pct) + '% · ' + rupiah(it.val) + '</span>' +
      '</div>';
    }).join('');
    body.innerHTML =
      '<div class="donut-wrap">' +
        '<div class="donut" style="background:conic-gradient(' + stops.join(', ') + ');">' +
          '<div class="donut-hole"><div class="dh-amt">' + rupiah(total) + '</div><div class="dh-label">Total</div></div>' +
        '</div>' +
        '<div class="legend">' + legendHtml + '</div>' +
      '</div>';
  }

  function renderTrend(){
    const body = document.getElementById('trendBody');
    const flat = allTransactionsFlat();
    if(flat.length === 0){ body.innerHTML = '<div class="budget-empty">Belum ada data buat trennya.</div>'; return; }
    const groups = {};
    flat.forEach(function(t){
      const key = t.date.slice(0,7);
      if(!groups[key]) groups[key] = { income:0, expense:0 };
      if(t.amount > 0) groups[key].income += t.amount; else groups[key].expense += Math.abs(t.amount);
    });
    const keys = Object.keys(groups).sort().slice(-6);
    const maxVal = Math.max(1, Math.max.apply(null, keys.map(function(k){ return Math.max(groups[k].income, groups[k].expense); })));
    const barsHtml = keys.map(function(k){
      const g = groups[k];
      const label = new Date(k + '-01').toLocaleDateString('id-ID', { month:'short' });
      const incH = Math.round((g.income/maxVal)*100);
      const expH = Math.round((g.expense/maxVal)*100);
      return '<div class="trend-col"><div class="trend-bars"><div class="trend-bar income" style="height:' + incH + '%"></div><div class="trend-bar expense" style="height:' + expH + '%"></div></div><div class="trend-label">' + label + '</div></div>';
    }).join('');
    body.innerHTML = '<div class="trend-chart">' + barsHtml + '</div>' +
      '<div class="trend-legend"><span><i class="dot income"></i>Masuk</span><span><i class="dot expense"></i>Keluar</span></div>';
  }

  function exportCSV(){
    const rows = [['Tanggal','Kartu','Kategori','Catatan','Jenis','Nominal']];
    allTransactionsFlat().slice().reverse().forEach(function(t){
      rows.push([t.date, t.pocketName, t.category, (t.note||'').replace(/,/g,';'), t.amount>0?'Pemasukan':'Pengeluaran', Math.abs(t.amount)]);
    });
    const csv = rows.map(function(r){ return r.map(String).map(function(v){ return '"' + v.replace(/"/g,'""') + '"'; }).join(','); }).join('\n');
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'riwayat-transaksi.csv';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToastMsg('Riwayat diunduh sebagai CSV');
  }

  function openModal(html){
    document.getElementById('modalBox').innerHTML = html;
    document.getElementById('modalOverlay').classList.add('open');
  }
  function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }
  function closeModalBackdrop(e){ if(e.target.id === 'modalOverlay') closeModal(); }

  function openAddPocketModal(){
    if(state.pockets.length >= MAX_POCKETS){ showToastMsg('Maksimal 3 kartu, hapus salah satu dulu'); return; }
    openModal(
      '<h3>' + iconSvg('wallet') + 'Tambah kartu</h3>' +
      '<div class="modal-sub">Kartu baru akan muncul di saku dompet kamu.</div>' +
      '<form id="addPocketForm">' +
        '<div class="form-group"><label>Nama kartu</label><input type="text" id="apName" placeholder="cth. Tabungan, Jajan, Kebutuhan" required maxlength="24"></div>' +
        '<div class="form-row2">' +
          '<div class="form-group"><label>Saldo awal (Rp)</label><input type="text" id="apBalance" placeholder="0" inputmode="numeric"></div>' +
          '<div class="form-group"><label>Target (opsional)</label><input type="text" id="apGoal" placeholder="cth. 10000000" inputmode="numeric"></div>' +
        '</div>' +
        '<div class="form-group"><label>Warna</label><div class="swatches" id="apSwatches"></div></div>' +
        '<div class="form-group"><label>Ikon</label><div class="icon-picker" id="apIcons"></div></div>' +
        '<div class="form-err" id="apError"></div>' +
        '<div class="modal-actions">' +
          '<button type="button" class="btn ghost" onclick="closeModal()">Batal</button>' +
          '<button type="submit" class="btn primary">Simpan kartu</button>' +
        '</div>' +
      '</form>'
    );
    window._apPicked = 'forest';
    window._apIconPicked = POCKET_ICON_KEYS[0];
    document.getElementById('apSwatches').innerHTML = Object.keys(COLORS).map(function(k){
      return '<div class="swatch ' + (k==='forest'?'picked':'') + '" data-k="' + k + '" style="background:' + COLORS[k].bg + '" onclick="pickPocketSwatch(\'' + k + '\')"></div>';
    }).join('');
    document.getElementById('apIcons').innerHTML = POCKET_ICON_KEYS.map(function(k,i){
      return '<div class="icon-opt ' + (i===0?'picked':'') + '" data-i="' + k + '" onclick="pickPocketIcon(\'' + k + '\')">' + iconSvg(k) + '</div>';
    }).join('');
    ['apBalance','apGoal'].forEach(function(id){
      document.getElementById(id).addEventListener('input', function(e){ e.target.value = e.target.value.replace(/\D/g,''); });
    });
    document.getElementById('addPocketForm').addEventListener('submit', function(e){
      e.preventDefault();
      const name = document.getElementById('apName').value.trim();
      const startBal = parseInt(document.getElementById('apBalance').value || '0', 10);
      const goalVal = document.getElementById('apGoal').value;
      const goal = goalVal ? parseInt(goalVal, 10) : null;
      const err = document.getElementById('apError');
      if(!name){ err.textContent = 'Nama kartu wajib diisi.'; err.classList.add('show'); shakeModal(); return; }
      const newPocket = { id: Date.now(), name: name, colorKey: window._apPicked || 'forest', icon: window._apIconPicked || 'wallet', goal: goal, locked:false, transactions: [] };
      if(startBal > 0){ newPocket.transactions.push({ id: Date.now()+1, category:'Lainnya', note:'Saldo awal', amount: startBal, date: TODAY }); }
      state.pockets.push(newPocket);
      newlyAddedId = newPocket.id;
      renderAll();
      saveState();
      closeModal();
      showToastMsg('Kartu baru siap!');
    });
  }
  function pickPocketSwatch(k){
    window._apPicked = k;
    document.querySelectorAll('.swatch').forEach(function(s){ s.classList.toggle('picked', s.dataset.k===k); });
  }
  function pickPocketIcon(k){
    window._apIconPicked = k;
    document.querySelectorAll('.icon-opt').forEach(function(s){ s.classList.toggle('picked', s.dataset.i===k); });
  }

  function openTxModal(type, presetPocketId, editId){
    if(state.pockets.length === 0){ showToastMsg('Tambah kartu dulu sebelum mencatat transaksi'); return; }
    const editing = !!editId;
    let editTx = null, editPocketId = null;
    if(editing){
      const ref = findTxRef(editId);
      if(ref){ editTx = ref.tx; editPocketId = ref.pocket.id; }
    }
    const isIncome = type === 'income';
    const selectedPocketId = editing ? editPocketId : (presetPocketId || state.pockets[0].id);
    const pocketOptions = state.pockets.map(function(p){
      return '<option value="' + p.id + '" ' + (selectedPocketId===p.id?'selected':'') + '>' + escapeHtml(p.name) + '</option>';
    }).join('');
    const catOptions = CATEGORIES.map(function(c){
      return '<option value="' + c + '" ' + (editTx && editTx.category===c ? 'selected':'') + '>' + c + '</option>';
    }).join('');

    openModal(
      '<h3>' + (editing ? iconSvg('receipt')+'Edit transaksi' : (isIncome ? iconSvg('wallet')+'Catat pemasukan' : iconSvg('bag')+'Catat pengeluaran')) + '</h3>' +
      '<div class="modal-sub">' + (isIncome ? 'Saldo kartu yang dipilih akan bertambah.' : 'Saldo kartu yang dipilih akan berkurang.') + '</div>' +
      '<div class="type-toggle">' +
        '<div class="type-opt ' + (isIncome?'active':'') + '" onclick="openTxModal(\'income\', ' + (presetPocketId||'null') + (editing?(', '+editId):'') + ')">Pemasukan</div>' +
        '<div class="type-opt ' + (!isIncome?'active':'') + '" onclick="openTxModal(\'expense\', ' + (presetPocketId||'null') + (editing?(', '+editId):'') + ')">Pengeluaran</div>' +
      '</div>' +
      '<form id="txForm">' +
        '<div class="form-group"><label>Kartu</label><select id="txPocket">' + pocketOptions + '</select></div>' +
        '<div class="form-group"><label>Kategori</label><select id="txCategory">' + catOptions + '</select></div>' +
        '<div class="form-row2">' +
          '<div class="form-group"><label>Nominal (Rp)</label><input type="text" id="txAmount" placeholder="cth. 250000" required inputmode="numeric" value="' + (editTx ? Math.abs(editTx.amount) : '') + '"></div>' +
          '<div class="form-group"><label>Tanggal</label><input type="date" id="txDate" value="' + (editTx ? editTx.date : TODAY) + '"></div>' +
        '</div>' +
        '<div class="form-group"><label>Catatan (opsional)</label><input type="text" id="txNote" placeholder="cth. Nasi goreng, bensin motor" maxlength="40" value="' + (editTx ? escapeHtml(editTx.note||'') : '') + '"></div>' +
        '<div class="form-err" id="txError"></div>' +
        '<div class="modal-actions">' +
          (editing ? '<button type="button" class="btn danger" onclick="deleteTransaction(' + editId + '); closeModal();">Hapus</button>' : '') +
          '<button type="button" class="btn ghost" onclick="closeModal()">Batal</button>' +
          '<button type="submit" class="btn primary">' + (editing ? 'Simpan perubahan' : 'Simpan') + '</button>' +
        '</div>' +
      '</form>'
    );
    document.getElementById('txAmount').addEventListener('input', function(e){ e.target.value = e.target.value.replace(/\D/g,''); });
    document.getElementById('txForm').addEventListener('submit', function(e){
      e.preventDefault();
      const pocketId = parseInt(document.getElementById('txPocket').value, 10);
      const category = document.getElementById('txCategory').value;
      const amt = parseInt(document.getElementById('txAmount').value || '0', 10);
      const date = document.getElementById('txDate').value || TODAY;
      const note = document.getElementById('txNote').value.trim();
      const err = document.getElementById('txError');
      const targetPocket = state.pockets.find(function(x){ return x.id===pocketId; });
      if(!targetPocket || !amt || amt <= 0){ err.textContent = 'Lengkapi kartu dan nominal yang valid.'; err.classList.add('show'); shakeModal(); return; }
      if(!isIncome && targetPocket.locked){ err.textContent = 'Kartu ini terkunci, buka kunci dulu buat mencatat pengeluaran.'; err.classList.add('show'); shakeModal(); return; }
      const signedAmt = isIncome ? amt : -amt;
      if(!isIncome){
        const excludeId = editing ? editId : null;
        if(!wouldBalanceCoverExpense(targetPocket, excludeId, amt)){ err.textContent = 'Saldo di kartu ini tidak cukup.'; err.classList.add('show'); shakeModal(); return; }
      }
      if(editing){
        const ref = findTxRef(editId);
        if(ref.pocket.id !== pocketId){
          ref.pocket.transactions.splice(ref.idx, 1);
          targetPocket.transactions.push({ id: editId, category: category, note: note, amount: signedAmt, date: date });
        }else{
          ref.tx.category = category; ref.tx.note = note; ref.tx.amount = signedAmt; ref.tx.date = date;
        }
      }else{
        targetPocket.transactions.push({ id: Date.now(), category: category, note: note, amount: signedAmt, date: date });
      }
      renderAll();
      saveState();
      closeModal();
      showToastMsg(editing ? 'Transaksi diperbarui' : randomSuccess());
    });
  }

  document.addEventListener('pointerdown', function(e){
    const btn = e.target.closest('.btn');
    if(!btn) return;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height) * 1.4;
    const r = document.createElement('span');
    r.className = 'ripple';
    r.style.width = r.style.height = size + 'px';
    r.style.left = (e.clientX - rect.left - size/2) + 'px';
    r.style.top = (e.clientY - rect.top - size/2) + 'px';
    btn.appendChild(r);
    setTimeout(function(){ r.remove(); }, 650);
  });

  function animateBarFill(selector, targetPct){
    const el = document.querySelector(selector);
    if(!el) return;
    el.style.width = '0%';
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ el.style.width = targetPct + '%'; });
    });
  }

  loadState();

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){ /* silent */ });
    });
  }
</script>
</body>
